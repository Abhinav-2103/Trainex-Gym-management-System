<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="en">
<head><title>Subscription Form | TRAINEX</title></head>
<body>
<div layout:fragment="content">

    <div class="toolbar">
        <a th:href="@{/subscriptions}" class="btn btn-secondary btn-sm">
            <span class="material-symbols-rounded" style="font-size:16px;">arrow_back</span> Back to Subscriptions
        </a>
    </div>

    <div class="form-card">
        <form th:action="@{/subscriptions/save}" th:object="${subscription}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-row">
                <div class="form-group">
                    <label for="member">Member *</label>
                    <select id="member" th:field="*{member.id}" class="form-control">
                        <option value="">-- Select Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}">Member</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('member')}" th:errors="*{member}"></div>
                </div>
                <div class="form-group">
                    <label for="plan">Plan *</label>
                    <select id="plan" th:field="*{plan.id}" class="form-control">
                        <option value="">-- Select Plan --</option>
                        <option th:each="p : ${plans}" th:value="${p.id}" th:text="${p.planName + ' (' + p.durationInMonths + ' months - ₹' + p.price + ')'}">Plan</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('plan')}" th:errors="*{plan}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="startDate">Start Date *</label>
                <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                <div class="form-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                <div style="margin-top:6px;color:var(--tx-muted);font-size:12px;">
                    End date &amp; status are auto-calculated based on plan duration.
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:8px;">
                <span class="material-symbols-rounded" style="font-size:18px;">save</span>
                Save Subscription
            </button>
        </form>
    </div>
</div>
</body>
</html>
