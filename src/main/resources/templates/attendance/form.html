<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="en">
<head><title>Mark Attendance | TRAINEX</title></head>
<body>
<div layout:fragment="content">

    <div class="toolbar">
        <a th:href="@{/attendance}" class="btn btn-secondary btn-sm">
            <span class="material-symbols-rounded" style="font-size:16px;">arrow_back</span> Back to Attendance
        </a>
    </div>

    <div class="form-card">
        <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="member">Member *</label>
                <select id="member" th:field="*{member.id}" class="form-control">
                    <option value="">-- Select Member --</option>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}">Member</option>
                </select>
                <div class="form-error" th:if="${#fields.hasErrors('member')}" th:errors="*{member}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="attendanceDate">Date *</label>
                    <input type="date" id="attendanceDate" th:field="*{attendanceDate}" class="form-control">
                    <div class="form-error" th:if="${#fields.hasErrors('attendanceDate')}" th:errors="*{attendanceDate}"></div>
                </div>
                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option value="">-- Select Status --</option>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:8px;">
                <span class="material-symbols-rounded" style="font-size:18px;">save</span>
                Save Attendance
            </button>
        </form>
    </div>
</div>
</body>
</html>
