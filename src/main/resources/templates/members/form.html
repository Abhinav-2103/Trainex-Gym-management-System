<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="en">
<head><title>Member Form | TRAINEX</title></head>
<body>
<div layout:fragment="content">

    <div class="toolbar">
        <a th:href="@{/members}" class="btn btn-secondary btn-sm">
            <span class="material-symbols-rounded" style="font-size:16px;">arrow_back</span> Back to Members
        </a>
    </div>

    <div class="form-card">
        <form th:action="@{/members/save}" th:object="${member}" method="post">
            <!-- Hidden ID for edit -->
            <input type="hidden" th:field="*{id}">

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter full name">
                    <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="98XXXXXXXX">
                    <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="member@email.com">
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label for="age">Age *</label>
                    <input type="number" id="age" th:field="*{age}" class="form-control" placeholder="25" min="10" max="100">
                    <div class="form-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" th:field="*{gender}" class="form-control">
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>
                <div class="form-group">
                    <label for="joinDate">Join Date *</label>
                    <input type="date" id="joinDate" th:field="*{joinDate}" class="form-control">
                    <div class="form-error" th:if="${#fields.hasErrors('joinDate')}" th:errors="*{joinDate}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="City, State">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:8px;">
                <span class="material-symbols-rounded" style="font-size:18px;">save</span>
                Save Member
            </button>
        </form>
    </div>
</div>
</body>
</html>
